name: chartquery
version: 1.1.0
description: "Charts, diagrams, QR codes and barcodes for Hermes: Chart.js charts from a config or a plain-words prompt, Mermaid, D2, PlantUML and 25 more diagram languages, styled QR codes and 25+ barcode types, returned as shareable image links, through the ChartQuery API."
author: ChartQuery
license: MIT
requires_hermes: ">=0.21.6"
provides_tools:
  - chartquery_chart
  - chartquery_chart_from_prompt
  - chartquery_qrcode
  - chartquery_barcode
  - chartquery_diagram
  - chartquery_diagram_from_prompt
  - chartquery_usage
provides_hooks: []
provides_middleware: []
requires_env:
  - name: CHARTQUERY_API_KEY
    description: ChartQuery API key
    url: https://app.chartquery.com
    secret: true
config_schema:
  api_key:
    type: secret
    env: CHARTQUERY_API_KEY
    label: ChartQuery API key
