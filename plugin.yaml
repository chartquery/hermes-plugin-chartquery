name: chartquery
version: 1.0.0
description: "Tools to render charts, QR codes and barcodes as shareable images, through the ChartQuery API."
author: ChartQuery
license: MIT
requires_hermes: ">=0.21.6"
provides_tools:
  - chartquery_chart
  - chartquery_chart_from_prompt
  - chartquery_qrcode
  - chartquery_barcode
provides_hooks: []
provides_middleware: []
requires_env:
  - name: CHARTQUERY_API_KEY
    description: ChartQuery API key
    url: https://app.chartquery.com
    secret: true
config_schema:
  api_key:
    type: secret
    env: CHARTQUERY_API_KEY
    label: ChartQuery API key
